<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" role="img" aria-label="Cheapest per token is not cheapest per answer: Kimi K3 has the cheapest tokens but Sol is cheapest per correct answer">
  <defs>
    <radialGradient id="glow" cx="18%" cy="8%" r="90%">
      <stop offset="0%" stop-color="#22262f"/>
      <stop offset="55%" stop-color="#15171d"/>
      <stop offset="100%" stop-color="#0f1116"/>
    </radialGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#6366f1"/></linearGradient>
    <linearGradient id="kimi" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/></linearGradient>
    <linearGradient id="fable" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fb7185"/><stop offset="1" stop-color="#f43f5e"/></linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="none" stroke="#2a2e37" stroke-width="1"/>

  <!-- eyebrow + headline -->
  <text x="80" y="92" fill="#f0a838" font-size="19" font-weight="700" letter-spacing="3.5">BHARATROUTER · FRONTIER-MODEL BENCHMARK</text>
  <text x="78" y="176" fill="#f4f2ec" font-size="64" font-weight="800" letter-spacing="-1.5">The cheapest token</text>
  <text x="78" y="244" fill="#f4f2ec" font-size="64" font-weight="800" letter-spacing="-1.5">isn't the cheapest <tspan fill="#f0a838">answer</tspan>.</text>

  <!-- column headers -->
  <text x="332" y="326" fill="#9aa0ad" font-size="17" font-weight="700" letter-spacing="1.5" text-anchor="end">CHEAPEST PER TOKEN</text>
  <text x="868" y="326" fill="#9aa0ad" font-size="17" font-weight="700" letter-spacing="1.5">CHEAPEST PER ANSWER</text>
  <text x="332" y="348" fill="#5f6672" font-size="13" text-anchor="end">what you're quoted</text>
  <text x="868" y="348" fill="#5f6672" font-size="13">what you actually pay</text>

  <!-- crossover connectors (drawn under pills) -->
  <g fill="none" stroke-width="7" opacity="0.85">
    <!-- Kimi: rank 1 -> 2 (drops) -->
    <path d="M330,400 C520,400 690,470 870,470" stroke="url(#kimi)"/>
    <!-- Sol: rank 2 -> 1 (rises), crosses Kimi -->
    <path d="M330,470 C520,470 690,400 870,400" stroke="url(#sol)"/>
    <!-- Fable: stays rank 3 -->
    <path d="M330,540 C520,540 690,540 870,540" stroke="url(#fable)"/>
  </g>
  <!-- crossover marker -->
  <circle cx="600" cy="435" r="6" fill="#f0a838"/>
  <text x="600" y="405" fill="#f0a838" font-size="13" font-weight="700" text-anchor="middle">the flip</text>

  <!-- LEFT pills (by output-token price) -->
  <g font-size="18" font-weight="700">
    <!-- Kimi $15 -->
    <rect x="70" y="376" width="262" height="48" rx="10" fill="#191c23" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="70" y="376" width="5" height="48" rx="2.5" fill="#2dd4bf"/>
    <text x="92" y="405" fill="#f4f2ec">Kimi K3</text><text x="316" y="405" fill="#2dd4bf" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">$15/M</text>
    <!-- Sol $30 -->
    <rect x="70" y="446" width="262" height="48" rx="10" fill="#191c23" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="70" y="446" width="5" height="48" rx="2.5" fill="#6366f1"/>
    <text x="92" y="475" fill="#f4f2ec">GPT-5.6 Sol</text><text x="316" y="475" fill="#818cf8" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">$30/M</text>
    <!-- Fable $50 -->
    <rect x="70" y="516" width="262" height="48" rx="10" fill="#191c23" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="70" y="516" width="5" height="48" rx="2.5" fill="#f43f5e"/>
    <text x="92" y="545" fill="#f4f2ec">Claude Fable 5</text><text x="316" y="545" fill="#fb7185" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">$50/M</text>
  </g>

  <!-- RIGHT pills (by ₹/correct) -->
  <g font-size="18" font-weight="700">
    <!-- Sol ₹1.43 -->
    <rect x="868" y="376" width="262" height="48" rx="10" fill="#191c23" stroke="#6366f1" stroke-width="1.5"/>
    <rect x="1125" y="376" width="5" height="48" rx="2.5" fill="#6366f1"/>
    <text x="890" y="405" fill="#f4f2ec">GPT-5.6 Sol</text><text x="1112" y="405" fill="#818cf8" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">₹1.43</text>
    <!-- Kimi ₹2.01 -->
    <rect x="868" y="446" width="262" height="48" rx="10" fill="#191c23" stroke="#2dd4bf" stroke-width="1.5"/>
    <rect x="1125" y="446" width="5" height="48" rx="2.5" fill="#2dd4bf"/>
    <text x="890" y="475" fill="#f4f2ec">Kimi K3</text><text x="1112" y="475" fill="#2dd4bf" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">₹2.01</text>
    <!-- Fable ₹4.68 -->
    <rect x="868" y="516" width="262" height="48" rx="10" fill="#191c23" stroke="#f43f5e" stroke-width="1.5"/>
    <rect x="1125" y="516" width="5" height="48" rx="2.5" fill="#f43f5e"/>
    <text x="890" y="545" fill="#f4f2ec">Claude Fable 5</text><text x="1112" y="545" fill="#fb7185" text-anchor="end" font-family="ui-monospace,monospace" font-size="17">₹4.68</text>
  </g>

  <!-- footer -->
  <text x="80" y="602" fill="#6b7280" font-size="15">GPT-5.6 Sol · Claude Fable 5 · Kimi K3 &#8194;—&#8194; 570 graded calls · one gateway · deterministic grading · prices per correct answer</text>
</svg>
